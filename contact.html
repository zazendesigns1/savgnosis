<style id="zdtt-promo-inline-css">
#zdtt-promo{
	position:fixed;
	bottom:26px;
	z-index:99998;
	width:min(340px, calc(100vw - 32px));
	opacity:0;
	transform:translateY(14px) scale(.97);
	transition:opacity .38s ease, transform .38s cubic-bezier(.16,.84,.44,1);
	pointer-events:none;
}
#zdtt-promo[hidden]{display:none;}
#zdtt-promo.zdtt-side-right{right:26px;transform-origin:100% 100%;}
#zdtt-promo.zdtt-side-left{left:26px;transform-origin:0 100%;}
#zdtt-promo.zdtt-in{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}

#zdtt-promo .zdtt-bubble{
	position:relative;
	padding:20px 22px 20px;
	border-radius:20px;
	background:linear-gradient(163deg,#211D38 0%,#12101E 100%);
	border:1px solid rgba(237,231,218,.13);
	box-shadow:0 22px 55px -14px rgba(0,0,0,.65), 0 2px 6px rgba(0,0,0,.25);
	color:#EDE7DA;
	font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
	-webkit-font-smoothing:antialiased;
}

/* speech-bubble tail */
#zdtt-promo .zdtt-bubble::before,
#zdtt-promo .zdtt-bubble::after{
	content:"";
	position:absolute;
	width:0;height:0;
	border-left:11px solid transparent;
	border-right:11px solid transparent;
}
#zdtt-promo .zdtt-bubble::before{
	bottom:-13px;
	border-top:13px solid rgba(237,231,218,.13);
}
#zdtt-promo .zdtt-bubble::after{
	bottom:-11px;
	border-top:13px solid #12101E;
}
#zdtt-promo.zdtt-side-right .zdtt-bubble::before,
#zdtt-promo.zdtt-side-right .zdtt-bubble::after{right:34px;}
#zdtt-promo.zdtt-side-left .zdtt-bubble::before,
#zdtt-promo.zdtt-side-left .zdtt-bubble::after{left:34px;}

#zdtt-promo .zdtt-heading{
	margin:0 0 7px;
	padding:0 26px 0 0;
	font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
	font-size:17px;
	font-weight:600;
	line-height:1.32;
	letter-spacing:.005em;
	color:#EDE7DA;
	text-transform:none;
}
#zdtt-promo .zdtt-body{
	margin:0 0 17px;
	padding:0;
	font-size:13px;
	line-height:1.55;
	color:rgba(237,231,218,.66);
	text-transform:none;
}

#zdtt-promo .zdtt-actions{display:flex;gap:9px;}
#zdtt-promo .zdtt-btn{
	flex:1 1 0;
	display:block;
	padding:10px 6px;
	border:1px solid rgba(237,231,218,.30);
	border-radius:999px;
	background:transparent;
	color:#EDE7DA;
	font-size:11.5px;
	font-weight:600;
	letter-spacing:.09em;
	text-transform:uppercase;
	text-align:center;
	text-decoration:none;
	line-height:1.2;
	transition:background-color .2s ease, border-color .2s ease, color .2s ease;
}
#zdtt-promo .zdtt-btn:hover,
#zdtt-promo .zdtt-btn:focus{
	background:#EDE7DA;
	border-color:#EDE7DA;
	color:#12101E;
	text-decoration:none;
}

#zdtt-promo .zdtt-close{
	position:absolute;
	top:10px;
	right:10px;
	width:26px;height:26px;
	display:flex;align-items:center;justify-content:center;
	padding:0;margin:0;
	border:0;border-radius:50%;
	background:transparent;
	color:rgba(237,231,218,.45);
	cursor:pointer;
	transition:color .2s ease, background-color .2s ease;
}
#zdtt-promo .zdtt-close:hover{color:#EDE7DA;background:rgba(237,231,218,.09);}
#zdtt-promo .zdtt-close svg{width:14px;height:14px;display:block;}

#zdtt-promo a:focus-visible,
#zdtt-promo button:focus-visible{outline:2px solid #E0B248;outline-offset:2px;}

@media (max-width:480px){
	#zdtt-promo{bottom:14px;width:calc(100vw - 24px);}
	#zdtt-promo.zdtt-side-right{right:12px;}
	#zdtt-promo.zdtt-side-left{left:12px;}
	#zdtt-promo .zdtt-bubble::before,
	#zdtt-promo .zdtt-bubble::after{display:none;}
	#zdtt-promo .zdtt-heading{font-size:16px;}
}

@media (prefers-reduced-motion:reduce){
	#zdtt-promo{transition:opacity .01ms linear;transform:none;}
	#zdtt-promo.zdtt-in{transform:none;}
}
/*# sourceURL=zdtt-promo-inline-css */
</style>

<script id="zdtt-promo-js-after">
(function () {
	function init() {
		var el = document.getElementById('zdtt-promo');
		if (!el) { return; }

		var KEY     = 'zdtt-hidden-until';
		var DAY     = 86400000;
		var delay   = parseInt(el.getAttribute('data-delay'), 10) || 6000;
		var snooze  = parseInt(el.getAttribute('data-snooze'), 10) || 14;
		var preview = location.search.indexOf('ttpreview=1') !== -1;

		function stored() {
			try { return parseInt(window.localStorage.getItem(KEY), 10) || 0; }
			catch (e) { return 0; }
		}
		function remember(days) {
			try { window.localStorage.setItem(KEY, String(Date.now() + days * DAY)); }
			catch (e) {}
		}

		if (!preview && Date.now() < stored()) { return; }

		function show() {
			el.hidden = false;
			window.requestAnimationFrame(function () {
				window.requestAnimationFrame(function () { el.classList.add('zdtt-in'); });
			});
		}

		function hide(days) {
			el.classList.remove('zdtt-in');
			remember(days);
			window.setTimeout(function () { el.hidden = true; }, 400);
		}

		window.setTimeout(show, preview ? 300 : delay);

		el.querySelector('.zdtt-close').addEventListener('click', function () {
			hide(snooze);
		});

		// Someone who taps through to a store doesn't need asking again for a year.
		Array.prototype.forEach.call(el.querySelectorAll('.zdtt-btn'), function (btn) {
			btn.addEventListener('click', function () { hide(365); });
		});

		document.addEventListener('keydown', function (e) {
			if ((e.key === 'Escape' || e.keyCode === 27) && !el.hidden) { hide(snooze); }
		});
	}

	// The markup prints at wp_footer priority 100, this script at priority 20 —
	// so the element does not exist yet when this runs. Wait for it.
	if (document.readyState === 'loading') {
		document.addEventListener('DOMContentLoaded', init);
	} else {
		init();
	}
}());
//# sourceURL=zdtt-promo-js-after
</script>

<script id="sg-contact-form">
(function () {
  var form = document.querySelector('form.elementor-form');
  if (!form) return;
  var btn = form.querySelector('button[type="submit"]');
  var label = btn ? btn.querySelector('.elementor-button-text') : null;
  var note = document.createElement('div');
  note.setAttribute('role', 'status');
  note.setAttribute('aria-live', 'polite');
  note.style.cssText = 'width:100%;margin-top:14px;font-size:16px;line-height:1.5;';
  form.appendChild(note);
  function say(msg, ok) {
    note.textContent = msg;
    note.className = 'elementor-message ' + (ok ? 'elementor-message-success' : 'elementor-message-danger');
  }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!form.checkValidity()) { form.reportValidity(); return; }
    var g = function (n) { var el = form.querySelector('[name="' + n + '"]'); return el ? el.value.trim() : ''; };
    if (parseInt(g('form_fields[math_question]'), 10) !== 20) { say('Please answer the question: 10+10=?', false); return; }
    if (g('botcheck')) { return; }
    var interested = Array.prototype.slice.call(form.querySelectorAll('[name="form_fields[interested][]"]:checked')).map(function (c) { return c.value; }).join(', ');
    var data = {
      access_key: '0902f5ca-0fb2-4515-910f-67470f509683',
      subject: 'New inquiry from savannahgnosis.com',
      from_name: 'Savannah Gnosis website',
      name: g('form_fields[name]'),
      email: g('form_fields[email]'),
      'How did you find us': g('form_fields[findus]'),
      message: g('form_fields[message]'),
      'Interested in Wednesday classes at 7pm': interested || '(not answered)'
    };
    var old = label ? label.textContent : '';
    if (btn) btn.disabled = true;
    if (label) label.textContent = 'SENDING...';
    fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(data)
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (res && res.success) { form.reset(); say('Thank you! Your message has been sent. We will be in touch soon.', true); }
      else { say('Sorry, something went wrong. Please email gnosissavannah@gmail.com instead.', false); }
    }).catch(function () {
      say('Sorry, the message could not be sent. Please email gnosissavannah@gmail.com instead.', false);
    }).then(function () {
      if (btn) btn.disabled = false;
      if (label) label.textContent = old;
    });
  });
})();
</script>
